<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14233A">
<title>UMAH AI Live Assistant</title>
<style>
  :root {
    --bg: #E8EDF2;
    --panel: #F7F9FB;
    --ink: #14233A;
    --muted: #5A6B80;
    --line: #C9D3DD;
    --green: #0B7A4B;
    --live: #D8432F;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
  }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 16px 8px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand h1 { font-family: var(--serif); font-size: 1.25rem; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
  .status { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
  body[data-state="listening"] .dot { background: var(--live); }
  body[data-state="paused"] .dot { background: #C98A14; }
  .head-tools { display: flex; gap: 8px; align-items: center; }
  select {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 8px; font-size: .85rem;
  }
  .icon-btn {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; font-size: .85rem; cursor: pointer;
  }

  /* Layout */
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 0 12px 10px; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-height: 0; display: flex; flex-direction: column; }
  .pane-title { font-size: .85rem; font-weight: 600; color: var(--muted); padding: 10px 14px 4px; display: flex; justify-content: space-between; align-items: center; }
  .scroll { overflow-y: auto; padding: 4px 14px 14px; flex: 1; -webkit-overflow-scrolling: touch; }
  #suggestPane { flex: 1.25; border-left: 5px solid var(--green); }
  #transcriptPane { flex: 1; border-radius: 10px; }
  #cameraPane { display: none; }

  /* Suggestions: newest is the hero, older fade back */
  .entry { padding: 10px 0 12px; border-bottom: 1px solid var(--line); }
  .entry:last-child { border-bottom: 0; }
  .entry time { display: block; font-size: .72rem; color: var(--muted); margin-bottom: 4px; }
  .entry p { font-family: var(--serif); line-height: 1.4; margin-top: 6px; }
  .entry:nth-child(1) p { font-size: 1.3rem; }
  .entry:not(:nth-child(1)) p { font-size: 1rem; color: var(--muted); }
  .thinking { color: var(--green); font-size: .85rem; padding: 6px 0; }
  .asked { font-size: .82rem; color: var(--ink); background: #DDEBE4; border-left: 3px solid var(--green); padding: 5px 8px; border-radius: 4px; margin-bottom: 4px; }
  .memnote { font-size: .72rem; color: var(--green); font-weight: 500; }

  /* Transcript */
  .line { font-size: .95rem; line-height: 1.5; padding: 3px 0; }
  .interim { color: var(--muted); font-style: italic; }
  .empty { color: var(--muted); font-size: .92rem; line-height: 1.5; padding: 6px 0; }
  .notice {
    margin: 0 12px 8px; padding: 10px 12px; border-radius: 10px; font-size: .88rem;
    background: #FBE9E5; border: 1px solid #EFB9AE; color: #7A241A;
  }
  .notice[hidden] { display: none; }

  /* Controls */
  .controls {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .ghost {
    flex: 1; background: transparent; border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 8px; font-size: .9rem; cursor: pointer; min-height: 48px;
  }
  .ghost:disabled { opacity: .45; cursor: default; }
  .mic {
    width: 72px; height: 72px; border-radius: 50%; border: 0; flex: none; cursor: pointer;
    background: var(--ink); color: #fff; display: grid; place-items: center; position: relative;
  }
  .mic svg { width: 30px; height: 30px; fill: currentColor; }
  body[data-state="listening"] .mic { background: var(--live); }
  body[data-state="paused"] .mic { background: #C98A14; }
  body[data-state="listening"] .mic::after {
    content: ""; position: absolute; inset: -7px; border-radius: 50%;
    border: 2px solid var(--live); animation: ring 1.6s ease-out infinite;
  }
  @keyframes ring { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.25); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { body[data-state="listening"] .mic::after { animation: none; } }

  /* Settings */
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: min(92vw, 420px); background: var(--panel); color: var(--ink); }
  dialog::backdrop { background: rgba(20,35,58,.45); }
  dialog h2 { font-family: var(--serif); font-size: 1.1rem; margin-bottom: 12px; }
  dialog label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  dialog input, dialog select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: .95rem; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  .primary { flex: 1; background: var(--green); color: #fff; border: 0; border-radius: 10px; padding: 12px; cursor: pointer; }

  /* Desktop */
  @media (min-width: 900px) {
    header { padding: 16px 24px 8px; }
    main { flex-direction: row; padding: 0 24px 12px; gap: 14px; }
    #suggestPane { order: 2; flex: 1.2; }
    #transcriptPane { order: 1; flex: 1; }
    #cameraPane { order: 3; width: 280px; flex: none; }
    body.cam #cameraPane { display: flex; }
    #cameraPane video { width: 100%; border-radius: 10px; background: #000; transform: scaleX(-1); }
    .cam-wrap { padding: 4px 14px 14px; }
    .controls { justify-content: center; gap: 16px; }
    .ghost { flex: none; width: 160px; }
    .desk-only { display: inline-block; }
  }
  .desk-only { display: none; }
</style>
</head>
<body data-state="idle">

<header>
  <div class="brand">
    <h1>UMAH AI Live</h1>
    <span class="status"><span class="dot"></span><span id="statusText">Ready</span></span>
  </div>
  <div class="head-tools">
    <select id="mode" aria-label="What are you using this for?">
      <option value="general">Conversation</option>
      <option value="meeting">Meeting</option>
      <option value="interview">Interview</option>
      <option value="class">Class</option>
    </select>
    <button class="icon-btn desk-only" id="camBtn" type="button">Camera</button>
    <button class="icon-btn" id="settingsBtn" type="button">Settings</button>
  </div>
</header>

<div class="notice" id="notice" hidden role="alert"></div>

<main>
  <section class="pane" id="suggestPane" aria-live="polite">
    <div class="pane-title"><span>Suggestions</span><span id="thinking" class="thinking" hidden>Thinking…</span></div>
    <div class="scroll" id="suggestions">
      <p class="empty">Tap the microphone and start talking. Suggestions appear here after each pause.</p>
    </div>
  </section>

  <section class="pane" id="transcriptPane">
    <div class="pane-title"><span>Live transcript</span><span class="memnote" id="memNote" hidden>Earlier conversation remembered</span></div>
    <div class="scroll" id="transcript"></div>
  </section>

  <section class="pane" id="cameraPane">
    <div class="pane-title"><span>Camera</span></div>
    <div class="cam-wrap"><video id="cam" autoplay playsinline muted></video></div>
  </section>
</main>

<div class="controls">
  <button class="ghost" id="clearBtn" type="button">Clear session</button>
  <button class="mic" id="micBtn" type="button" aria-label="Start listening">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Zm6-4a1 1 0 1 1 2 0 8 8 0 0 1-7 7.94V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-2.06A8 8 0 0 1 4 11a1 1 0 1 1 2 0 6 6 0 0 0 12 0Z"/></svg>
  </button>
  <button class="ghost" id="askBtn" type="button" disabled>Suggest now</button>
</div>

<dialog id="settings">
  <h2>Settings</h2>
  <label for="apiUrl">Server address</label>
  <input id="apiUrl" type="url" inputmode="url" placeholder="https://your-worker.workers.dev/api/suggest" autocomplete="off">
  <label for="lang">Speech language</label>
  <select id="lang">
    <option value="en-NG">English (Nigeria)</option>
    <option value="en-GB">English (UK)</option>
    <option value="en-US">English (US)</option>
  </select>
  <label for="delay">Suggest after a pause of</label>
  <select id="delay">
    <option value="1200">1 second</option>
    <option value="2000" selected>2 seconds</option>
    <option value="3500">3.5 seconds</option>
  </select>
  <div class="row">
    <button class="primary" id="saveSettings" type="button">Save settings</button>
  </div>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  const cfg = {
    apiUrl: localStorage.getItem("umah.apiUrl") || "https://umah-ai.umahglobal1000.workers.dev/api/suggest",
    lang: localStorage.getItem("umah.lang") || "en-NG",
    delay: Number(localStorage.getItem("umah.delay")) || 2000,
  };

  const state = {
    mode: "idle",            // idle | listening | paused
    segments: [],            // finalized transcript lines
    sentCount: 0,            // segments already covered by a request
    suggestions: [],         // [{time, question, lines}]
    summary: "",             // rolling summary of older conversation
    summarizedCount: 0,      // segments already folded into the summary
    summarizing: false,
    session: 0,              // bumped on clear so late replies are ignored
    pendingQ: null,
    inflight: false,
    queued: false,
    timer: null,
    rec: null,
    wake: null,
    clearArmed: null,
  };

  /* ---------- UI helpers ---------- */
  function setMode(m) {
    state.mode = m;
    document.body.dataset.state = m;
    $("statusText").textContent = { idle: "Ready", listening: "Listening", paused: "Paused" }[m];
    $("micBtn").setAttribute("aria-label", { idle: "Start listening", listening: "Pause", paused: "Resume listening" }[m]);
  }
  function showNotice(msg) {
    const n = $("notice");
    n.textContent = msg || "";
    n.hidden = !msg;
  }
  function renderTranscript(interim = "") {
    const box = $("transcript");
    box.textContent = "";
    if (!state.segments.length && !interim) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "What you say will appear here as you speak.";
      box.appendChild(p);
      return;
    }
    state.segments.forEach((t) => {
      const d = document.createElement("div");
      d.className = "line";
      d.textContent = t;
      box.appendChild(d);
    });
    if (interim) {
      const d = document.createElement("div");
      d.className = "line interim";
      d.textContent = interim;
      box.appendChild(d);
    }
    box.scrollTop = box.scrollHeight;
  }
  function renderSuggestions() {
    const box = $("suggestions");
    box.textContent = "";
    if (!state.suggestions.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Tap the microphone and start talking. Suggestions appear here after each pause.";
      box.appendChild(p);
      return;
    }
    [...state.suggestions].reverse().forEach((s) => {
      const e = document.createElement("div");
      e.className = "entry";
      const t = document.createElement("time");
      t.textContent = s.time;
      e.appendChild(t);
      if (s.question) {
        const q = document.createElement("div");
        q.className = "asked";
        q.textContent = "Question: " + s.question;
        e.appendChild(q);
      }
      s.lines.forEach((l) => {
        const p = document.createElement("p");
        p.textContent = l;
        e.appendChild(p);
      });
      box.appendChild(e);
    });
    box.scrollTop = 0;
  }

  /* ---------- Screen wake lock ---------- */
  async function holdScreen() {
    try { if ("wakeLock" in navigator) state.wake = await navigator.wakeLock.request("screen"); } catch {}
  }
  function releaseScreen() {
    try { state.wake && state.wake.release(); } catch {}
    state.wake = null;
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && state.mode === "listening") holdScreen();
  });

  /* ---------- Speech recognition ---------- */
  function buildRecognizer() {
    const rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = cfg.lang;

    rec.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) {
          const text = r[0].transcript.trim();
          if (text) {
            state.segments.push(text);
            if (looksLikeQuestion(text)) {
              clearTimeout(state.timer);
              requestSuggestion(false, lastSentence(text));
            } else {
              scheduleSuggestion();
            }
          }
        } else {
          interim += r[0].transcript;
        }
      }
      renderTranscript(interim);
      $("askBtn").disabled = !state.segments.length;
    };
    rec.onerror = (e) => {
      if (e.error === "no-speech" || e.error === "aborted") return;
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        showNotice("Microphone access is blocked. Allow the microphone for this page in your browser settings, then tap the microphone again.");
        stopListening("idle");
      } else if (e.error === "network") {
        showNotice("Speech recognition needs an internet connection. Check your data or Wi-Fi.");
      } else {
        showNotice("Speech recognition stopped (" + e.error + "). Tap the microphone to try again.");
      }
    };
    rec.onend = () => {
      if (state.mode === "listening") setTimeout(() => { try { rec.start(); } catch {} }, 250);
    };
    return rec;
  }

  function startListening() {
    if (!SR) {
      showNotice("This browser can't do live speech recognition. Use Chrome or Edge.");
      return;
    }
    showNotice("");
    state.rec = buildRecognizer();
    try { state.rec.start(); } catch {}
    setMode("listening");
    holdScreen();
  }
  function stopListening(next) {
    clearTimeout(state.timer);
    const r = state.rec;
    state.rec = null;
    setMode(next);
    if (r) { r.onend = null; try { r.stop(); } catch {} }
    releaseScreen();
    renderTranscript();
  }

  /* ---------- Question detection ---------- */
  const Q_START = /^(who|whom|whose|what|what's|when|where|why|how|which|can|could|would|should|do|does|did|is|are|am|was|were|will|have|has|tell me|explain|describe|give me|walk me through)\b/i;
  function lastSentence(t) {
    const parts = t.trim().match(/[^.!?]+[.!?]?/g) || [t];
    return parts[parts.length - 1].trim();
  }
  function looksLikeQuestion(t) {
    const s = lastSentence(t);
    if (s.length < 8) return false;
    if (/\?\s*$/.test(s)) return true;
    return s.split(/\s+/).length >= 4 && Q_START.test(s);
  }

  /* ---------- AI suggestions ---------- */
  const KEEP_RECENT = 8;   // newest lines always sent word for word
  const FOLD_AT = 14;      // fold older lines into the summary once this many pile up

  function summarizeUrl() {
    return cfg.apiUrl.replace(/\/suggest$/, "/summarize");
  }

  function scheduleSuggestion() {
    clearTimeout(state.timer);
    state.timer = setTimeout(() => requestSuggestion(false), cfg.delay);
  }

  async function requestSuggestion(manual, question) {
    if (!state.segments.length) return;
    if (!manual && !question && state.segments.length === state.sentCount) return;
    if (state.inflight) {
      state.queued = true;
      if (question) state.pendingQ = question;
      return;
    }

    const fresh = state.segments.slice(state.sentCount).join(" ");
    if (!manual && !question && fresh.split(/\s+/).length < 4) return; // wait for a fuller thought

    state.inflight = true;
    $("thinking").hidden = false;
    const session = state.session;
    const covered = state.segments.length;

    const transcript = state.segments.slice(state.summarizedCount).join("\n").slice(-4000);
    const previous = state.suggestions.slice(-4).flatMap((s) => s.lines);

    try {
      const res = await fetch(cfg.apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          transcript,
          summary: state.summary,
          question: question || "",
          previous,
          mode: $("mode").value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Server error " + res.status);
      if (session !== state.session) return; // session was cleared meanwhile
      state.sentCount = covered;
      showNotice("");
      if (data.suggestions && data.suggestions.length) {
        state.suggestions.push({
          time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
          question: question || "",
          lines: data.suggestions,
        });
        renderSuggestions();
      }
      maybeSummarize();
    } catch (err) {
      showNotice("Couldn't get suggestions: " + err.message + ". Check the server address in Settings.");
    } finally {
      state.inflight = false;
      $("thinking").hidden = true;
      if (state.queued) {
        state.queued = false;
        const q = state.pendingQ;
        state.pendingQ = null;
        if (q) requestSuggestion(false, q);
        else scheduleSuggestion();
      }
    }
  }

  /* Rolling summary: keeps long sessions inside the AI's context without losing the thread */
  async function maybeSummarize() {
    if (state.summarizing) return;
    if (state.segments.length - state.summarizedCount < FOLD_AT) return;
    const foldEnd = state.segments.length - KEEP_RECENT;
    const text = state.segments.slice(state.summarizedCount, foldEnd).join("\n");
    const session = state.session;
    state.summarizing = true;
    try {
      const res = await fetch(summarizeUrl(), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ summary: state.summary, text }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || session !== state.session) return;
      state.summary = data.summary || state.summary;
      state.summarizedCount = foldEnd;
      $("memNote").hidden = !state.summary;
    } catch {
      /* summary is an optimisation; try again after the next suggestion */
    } finally {
      state.summarizing = false;
    }
  }

  /* ---------- Controls ---------- */
  $("micBtn").addEventListener("click", () => {
    if (state.mode === "idle") startListening();
    else if (state.mode === "listening") stopListening("paused");
    else startListening();
  });
  $("askBtn").addEventListener("click", () => { clearTimeout(state.timer); requestSuggestion(true); });

  $("clearBtn").addEventListener("click", () => {
    const btn = $("clearBtn");
    if (!state.clearArmed) {
      btn.textContent = "Tap again to clear";
      state.clearArmed = setTimeout(() => { btn.textContent = "Clear session"; state.clearArmed = null; }, 3000);
      return;
    }
    clearTimeout(state.clearArmed);
    state.clearArmed = null;
    btn.textContent = "Clear session";
    if (state.mode !== "idle") stopListening("idle");
    state.segments = []; state.sentCount = 0; state.suggestions = [];
    state.summary = ""; state.summarizedCount = 0; state.pendingQ = null;
    state.session++;
    state.queued = false;
    $("memNote").hidden = true;
    $("askBtn").disabled = true;
    showNotice("");
    renderTranscript();
    renderSuggestions();
  });

  /* ---------- Settings ---------- */
  const dlg = $("settings");
  $("settingsBtn").addEventListener("click", () => {
    $("apiUrl").value = cfg.apiUrl;
    $("lang").value = cfg.lang;
    $("delay").value = String(cfg.delay);
    dlg.showModal();
  });
  $("saveSettings").addEventListener("click", () => {
    cfg.apiUrl = $("apiUrl").value.trim() || "https://umah-ai.umahglobal1000.workers.dev/api/suggest";
    cfg.lang = $("lang").value;
    cfg.delay = Number($("delay").value);
    localStorage.setItem("umah.apiUrl", cfg.apiUrl);
    localStorage.setItem("umah.lang", cfg.lang);
    localStorage.setItem("umah.delay", String(cfg.delay));
    dlg.close();
    if (state.mode === "listening") { stopListening("paused"); startListening(); }
  });

  /* ---------- Camera (desktop) ---------- */
  let camStream = null;
  $("camBtn").addEventListener("click", async () => {
    if (camStream) {
      camStream.getTracks().forEach((t) => t.stop());
      camStream = null;
      $("cam").srcObject = null;
      document.body.classList.remove("cam");
      return;
    }
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: true });
      $("cam").srcObject = camStream;
      document.body.classList.add("cam");
    } catch {
      showNotice("Camera access was blocked. Allow the camera for this page to use the preview.");
    }
  });

  /* ---------- Init ---------- */
  renderTranscript();
  renderSuggestions();
  if (!SR) showNotice("This browser can't do live speech recognition. Use Chrome or Edge.");
})();
</script>
</body>
</html>
