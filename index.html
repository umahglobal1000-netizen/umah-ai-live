<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14233A">
<title>UMAH AI Live Assistant</title>
<style>
  :root {
    --bg: #E8EDF2;
    --panel: #F7F9FB;
    --ink: #14233A;
    --muted: #5A6B80;
    --line: #C9D3DD;
    --green: #0B7A4B;
    --live: #D8432F;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
  }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 16px 8px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand h1 { font-family: var(--serif); font-size: 1.25rem; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
  .status { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
  body[data-state="listening"] .dot { background: var(--live); }
  body[data-state="paused"] .dot { background: #C98A14; }
  .head-tools { display: flex; gap: 8px; align-items: center; }
  select {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 8px; font-size: .85rem;
  }
  .icon-btn {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; font-size: .85rem; cursor: pointer;
  }

  /* Layout */
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 0 12px 10px; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-height: 0; display: flex; flex-direction: column; }
  .pane-title { font-size: .85rem; font-weight: 600; color: var(--muted); padding: 10px 14px 4px; display: flex; justify-content: space-between; align-items: center; }
  .scroll { overflow-y: auto; padding: 4px 14px 14px; flex: 1; -webkit-overflow-scrolling: touch; }
  #suggestPane { flex: 1.25; border-left: 5px solid var(--green); }
  #transcriptPane { flex: 1; border-radius: 10px; }
  #cameraPane { display: none; }

  /* Suggestions: newest is the hero, older fade back */
  .entry { padding: 10px 0 12px; border-bottom: 1px solid var(--line); }
  .entry:last-child { border-bottom: 0; }
  .entry time { display: block; font-size: .72rem; color: var(--muted); margin-bottom: 4px; }
  .entry p { font-family: var(--serif); line-height: 1.4; margin-top: 6px; }
  .entry:nth-child(1) p { font-size: 1.15rem; }
  .entry:not(:nth-child(1)) p { font-size: 1rem; color: var(--muted); }
  .thinking { color: var(--green); font-size: .85rem; padding: 6px 0; }
  .asked { font-size: 1rem; font-weight: 600; line-height: 1.35; color: var(--ink); background: #DDEBE4; border-left: 3px solid var(--green); padding: 8px 10px; border-radius: 6px; margin: 4px 0 6px; }
  .pending { color: var(--green); font-size: .9rem; padding: 4px 0; }
  .memnote { font-size: .72rem; color: var(--green); font-weight: 500; }

  /* Transcript */
  .line { font-size: .95rem; line-height: 1.5; padding: 3px 0; }
  .interim { color: var(--muted); font-style: italic; }
  .empty { color: var(--muted); font-size: .92rem; line-height: 1.5; padding: 6px 0; }
  .notice {
    margin: 0 12px 8px; padding: 10px 12px; border-radius: 10px; font-size: .88rem;
    background: #FBE9E5; border: 1px solid #EFB9AE; color: #7A241A;
  }
  .notice[hidden] { display: none; }

  /* Typed question bar */
  .askbar { display: flex; gap: 8px; padding: 0 12px 4px; }
  .askbar input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 1rem; }
  .askbar button { background: var(--green); color: #fff; border: 0; border-radius: 12px; padding: 0 18px; font-weight: 600; cursor: pointer; }
  @media (min-width: 900px) { .askbar { padding: 0 24px 4px; } }

  /* Attachments */
  .askwrap { position: relative; }
  .attach { width: 46px; flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--green); }
  .menu { position: absolute; bottom: calc(100% + 6px); left: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 20px rgba(20,35,58,.18); overflow: hidden; z-index: 5; min-width: 180px; }
  .menu[hidden] { display: none; }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 13px 16px; font-size: 1rem; cursor: pointer; border-bottom: 1px solid var(--line); }
  .menu button:last-child { border-bottom: 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 6px; }
  .chips[hidden] { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: #DDEBE4; border: 1px solid #B5D9C6; border-radius: 999px; padding: 4px 6px 4px 12px; font-size: .82rem; max-width: 100%; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46vw; }
  .chip button { background: none; border: 0; font-size: 1rem; cursor: pointer; padding: 0 6px; color: var(--muted); }
  .notice.ok { background: #E2F1EA; border-color: #B5D9C6; color: #0B5B38; }
  @media (min-width: 900px) { .chips { padding: 0 24px 6px; } .menu { left: 24px; } }

  /* Controls */
  .controls {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .ghost {
    flex: 1; background: transparent; border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 8px; font-size: .9rem; cursor: pointer; min-height: 48px;
  }
  .ghost:disabled { opacity: .45; cursor: default; }
  .mic {
    width: 72px; height: 72px; border-radius: 50%; border: 0; flex: none; cursor: pointer;
    background: var(--ink); color: #fff; display: grid; place-items: center; position: relative;
  }
  .mic svg { width: 30px; height: 30px; fill: currentColor; }
  body[data-state="listening"] .mic { background: var(--live); }
  body[data-state="paused"] .mic { background: #C98A14; }
  body[data-state="listening"] .mic::after {
    content: ""; position: absolute; inset: -7px; border-radius: 50%;
    border: 2px solid var(--live); animation: ring 1.6s ease-out infinite;
  }
  @keyframes ring { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.25); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { body[data-state="listening"] .mic::after { animation: none; } }

  /* Settings */
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: min(92vw, 420px); background: var(--panel); color: var(--ink); }
  dialog::backdrop { background: rgba(20,35,58,.45); }
  dialog h2 { font-family: var(--serif); font-size: 1.1rem; margin-bottom: 12px; }
  dialog label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  dialog input, dialog select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: .95rem; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  .primary { flex: 1; background: var(--green); color: #fff; border: 0; border-radius: 10px; padding: 12px; cursor: pointer; }

  /* Desktop */
  @media (min-width: 900px) {
    header { padding: 16px 24px 8px; }
    main { flex-direction: row; padding: 0 24px 12px; gap: 14px; }
    #suggestPane { order: 2; flex: 1.2; }
    #transcriptPane { order: 1; flex: 1; }
    #cameraPane { order: 3; width: 280px; flex: none; }
    body.cam #cameraPane { display: flex; }
    #cameraPane video { width: 100%; border-radius: 10px; background: #000; transform: scaleX(-1); }
    .cam-wrap { padding: 4px 14px 14px; }
    .controls { justify-content: center; gap: 16px; }
    .ghost { flex: none; width: 160px; }
    .desk-only { display: inline-block; }
  }
  .desk-only { display: none; }
</style>
</head>
<body data-state="idle">

<header>
  <div class="brand">
    <h1>UMAH AI Live</h1>
    <span class="status"><span class="dot"></span><span id="statusText">Ready</span></span>
  </div>
  <div class="head-tools">
    <select id="mode" aria-label="What are you using this for?">
      <option value="answer" selected>Answer questions</option>
      <option value="general">Conversation</option>
      <option value="meeting">Meeting</option>
      <option value="interview">Interview</option>
      <option value="class">Class</option>
    </select>
    <button class="icon-btn desk-only" id="camBtn" type="button">Camera</button>
    <button class="icon-btn" id="settingsBtn" type="button">Settings</button>
  </div>
</header>

<div class="notice" id="notice" hidden role="alert"></div>

<main>
  <section class="pane" id="suggestPane" aria-live="polite">
    <div class="pane-title"><span>Suggestions</span><span id="thinking" class="thinking" hidden>Thinking…</span></div>
    <div class="scroll" id="suggestions">
      <p class="empty">Tap the microphone and start talking. Suggestions appear here after each pause.</p>
    </div>
  </section>

  <section class="pane" id="transcriptPane">
    <div class="pane-title"><span>Live transcript</span><span class="memnote" id="memNote" hidden>Earlier conversation remembered</span></div>
    <div class="scroll" id="transcript"></div>
  </section>

  <section class="pane" id="cameraPane">
    <div class="pane-title"><span>Camera</span></div>
    <div class="cam-wrap"><video id="cam" autoplay playsinline muted></video></div>
  </section>
</main>

<div class="chips" id="chips" hidden></div>
<div class="askwrap">
  <div class="menu" id="attachMenu" hidden>
    <button id="pickCamera" type="button">Take photo</button>
    <button id="pickPhoto" type="button">Choose photo</button>
    <button id="pickFile" type="button">Choose file</button>
  </div>
  <div class="askbar">
    <button class="attach" id="attachBtn" type="button" aria-label="Attach a photo or file">+</button>
    <input id="typed" type="text" placeholder="Type a question for the AI…" enterkeyhint="send" autocomplete="off">
    <button id="typedSend" type="button">Ask</button>
  </div>
</div>
<input type="file" id="inCamera" accept="image/*" capture="environment" hidden>
<input type="file" id="inPhoto" accept="image/*" hidden>
<input type="file" id="inFile" accept=".pdf,.docx,.txt,.md,.csv,text/plain,application/pdf" multiple hidden>

<div class="controls">
  <button class="ghost" id="clearBtn" type="button">Clear session</button>
  <button class="mic" id="micBtn" type="button" aria-label="Start listening">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Zm6-4a1 1 0 1 1 2 0 8 8 0 0 1-7 7.94V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-2.06A8 8 0 0 1 4 11a1 1 0 1 1 2 0 6 6 0 0 0 12 0Z"/></svg>
  </button>
  <button class="ghost" id="askBtn" type="button" disabled>Suggest now</button>
</div>

<dialog id="settings">
  <h2>Settings</h2>
  <label for="apiUrl">Server address</label>
  <input id="apiUrl" type="url" inputmode="url" placeholder="https://your-worker.workers.dev/api/suggest" autocomplete="off">
  <label for="lang">Speech language</label>
  <select id="lang">
    <option value="en-NG">English (Nigeria)</option>
    <option value="en-GB">English (UK)</option>
    <option value="en-US">English (US)</option>
  </select>
  <label for="noise">Background noise filter</label>
  <select id="noise">
    <option value="off">Off (accept everything)</option>
    <option value="normal">Normal</option>
    <option value="strict">Strict (noisy places)</option>
  </select>
  <label for="delay">Suggest after a pause of</label>
  <select id="delay">
    <option value="1200">1 second</option>
    <option value="2000" selected>2 seconds</option>
    <option value="3500">3.5 seconds</option>
  </select>
  <div class="row">
    <button class="primary" id="saveSettings" type="button">Save settings</button>
  </div>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  const cfg = {
    apiUrl: localStorage.getItem("umah.apiUrl") || "https://umah-ai.umahglobal1000.workers.dev/api/suggest",
    lang: localStorage.getItem("umah.lang") || "en-NG",
    delay: Number(localStorage.getItem("umah.delay")) || 2000,
    noise: localStorage.getItem("umah.noise") || "normal",
  };

  const state = {
    mode: "idle",            // idle | listening | paused
    segments: [],            // finalized transcript lines
    sentCount: 0,            // segments already covered by a request
    suggestions: [],         // [{time, question, lines}]
    summary: "",             // rolling summary of older conversation
    summarizedCount: 0,      // segments already folded into the summary
    summarizing: false,
    session: 0,              // bumped on clear so late replies are ignored
    pendingQ: null,
    qQueue: [],
    docs: [],                // attached reference material [{name, text}]
    qTimer: null,
    lastQ: "",
    inflight: false,
    queued: false,
    timer: null,
    rec: null,
    wake: null,
    clearArmed: null,
  };

  /* ---------- UI helpers ---------- */
  function setMode(m) {
    state.mode = m;
    document.body.dataset.state = m;
    $("statusText").textContent = { idle: "Ready", listening: "Listening", paused: "Paused" }[m];
    $("micBtn").setAttribute("aria-label", { idle: "Start listening", listening: "Pause", paused: "Resume listening" }[m]);
  }
  function showNotice(msg, ok) {
    const n = $("notice");
    n.textContent = msg || "";
    n.classList.toggle("ok", !!ok);
    n.hidden = !msg;
  }
  function setBusy(text) {
    const el = $("thinking");
    el.textContent = text || "Thinking…";
    el.hidden = !text;
  }
  function renderTranscript(interim = "") {
    const box = $("transcript");
    box.textContent = "";
    if (!state.segments.length && !interim) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "What you say will appear here as you speak.";
      box.appendChild(p);
      return;
    }
    state.segments.forEach((t) => {
      const d = document.createElement("div");
      d.className = "line";
      d.textContent = t;
      box.appendChild(d);
    });
    if (interim) {
      const d = document.createElement("div");
      d.className = "line interim";
      d.textContent = interim;
      box.appendChild(d);
    }
    box.scrollTop = box.scrollHeight;
  }
  function renderSuggestions() {
    const box = $("suggestions");
    box.textContent = "";
    if (!state.suggestions.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Tap the microphone and start talking. Suggestions appear here after each pause.";
      box.appendChild(p);
      return;
    }
    [...state.suggestions].reverse().forEach((s) => {
      const e = document.createElement("div");
      e.className = "entry";
      const t = document.createElement("time");
      t.textContent = s.time;
      e.appendChild(t);
      if (s.question) {
        const q = document.createElement("div");
        q.className = "asked";
        q.textContent = "Q: " + s.question;
        e.appendChild(q);
      }
      if (s.pending) {
        const w = document.createElement("div");
        w.className = "pending";
        w.textContent = "Answering…";
        e.appendChild(w);
      }
      s.lines.forEach((l) => {
        const p = document.createElement("p");
        p.textContent = l;
        e.appendChild(p);
      });
      box.appendChild(e);
    });
    box.scrollTop = 0;
  }

  /* ---------- Screen wake lock ---------- */
  async function holdScreen() {
    try { if ("wakeLock" in navigator) state.wake = await navigator.wakeLock.request("screen"); } catch {}
  }
  function releaseScreen() {
    try { state.wake && state.wake.release(); } catch {}
    state.wake = null;
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && state.mode === "listening") holdScreen();
  });

  /* ---------- Speech recognition ---------- */
  function buildRecognizer() {
    const rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = cfg.lang;

    rec.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) {
          const text = r[0].transcript.trim();
          if (text && passesNoiseFilter(text, r[0].confidence)) {
            addSegment(text);
            const q = looksLikeQuestion(text) ? lastSentence(text) : "";
            if (q) {
              clearTimeout(state.timer);
              clearTimeout(state.qTimer);
              state.qTimer = setTimeout(() => requestSuggestion(false, q), Math.min(cfg.delay, 1000));
            } else if ($("mode").value !== "answer") {
              scheduleSuggestion();
            }
          }
        } else {
          interim += r[0].transcript;
        }
      }
      if ($("notice").textContent.startsWith("Speech recognition")) showNotice("");
      renderTranscript(interim);
      $("askBtn").disabled = !state.segments.length;
    };
    rec.onerror = (e) => {
      if (state.mode !== "listening") return;
      if (e.error === "no-speech" || e.error === "aborted") return;
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        showNotice("Microphone access is blocked. Allow the microphone for this page in your browser settings, then tap the microphone again.");
        stopListening("idle");
      } else if (e.error === "network") {
        showNotice("Speech recognition needs an internet connection. Check your data or Wi-Fi.");
      } else {
        showNotice("Speech recognition stopped (" + e.error + "). Tap the microphone to try again.");
      }
    };
    rec.onend = () => {
      if (state.mode === "listening") setTimeout(() => { try { rec.start(); } catch {} }, 250);
    };
    return rec;
  }

  function startListening() {
    if (!SR) {
      showNotice("This browser can't do live speech recognition. Use Chrome or Edge.");
      return;
    }
    showNotice("");
    state.rec = buildRecognizer();
    try { state.rec.start(); } catch {}
    setMode("listening");
    holdScreen();
  }
  function stopListening(next) {
    clearTimeout(state.timer);
    clearTimeout(state.qTimer);
    const r = state.rec;
    state.rec = null;
    setMode(next);
    if (r) { r.onend = null; try { r.stop(); } catch {} }
    releaseScreen();
    renderTranscript();
  }

  /* ---------- Question detection ---------- */
  const Q_WH = /^(who|whom|whose|what|what's|when|where|why|how|which)\b/i;
  const Q_VERB = /^(define|explain|describe|list|state|mention|outline|summari[sz]e|identify|discuss|justify|calculate|solve|compare|contrast|differentiate|distinguish)\b/i;
  const Q_AUX = /^(can|could|would|should|do|does|did|is|are|am|was|were|will|have|has|tell me|give me|walk me through|i want to know|i need to know)\b/i;
  const Q_ANYWHERE = /\b(difference between|differences between|differentiate between|distinguish between|meaning of)\b/i;
  function lastSentence(t) {
    const parts = t.trim().match(/[^.!?]+[.!?]?/g) || [t];
    return parts[parts.length - 1].trim();
  }
  function looksLikeQuestion(t) {
    const s = lastSentence(t);
    if (s.length < 6) return false;
    if (/\?\s*$/.test(s)) return true;
    const words = s.split(/\s+/).length;
    if (words >= 3 && Q_WH.test(s)) return true;          // "what is marketing"
    if (words >= 2 && Q_VERB.test(s)) return true;        // "define marketing"
    if (words >= 4 && (Q_AUX.test(s) || Q_ANYWHERE.test(s))) return true;
    return false;
  }

  /* Noise filter: drop low-confidence or very short fragments picked up from background noise */
  function passesNoiseFilter(text, confidence) {
    if (cfg.noise === "off") return true;
    const words = text.trim().split(/\s+/).length;
    const minConf = cfg.noise === "strict" ? 0.7 : 0.45;
    const minWords = cfg.noise === "strict" ? 3 : 2;
    if (confidence > 0 && confidence < minConf) return false; // 0 means the browser gave no score
    return words >= minWords;
  }

  /* Android sends growing partial phrases as "final"; merge them into one line */
  function addSegment(text) {
    const last = state.segments[state.segments.length - 1];
    if (last) {
      const a = last.toLowerCase(), b = text.toLowerCase();
      if (b === a || a.startsWith(b)) return;
      if (b.startsWith(a) && state.segments.length - 1 >= state.summarizedCount) {
        state.segments[state.segments.length - 1] = text;
        state.sentCount = Math.min(state.sentCount, state.segments.length - 1);
        return;
      }
    }
    state.segments.push(text);
  }

  /* ---------- AI suggestions ---------- */
  const KEEP_RECENT = 8;   // newest lines always sent word for word
  const FOLD_AT = 14;      // fold older lines into the summary once this many pile up

  function summarizeUrl() {
    return cfg.apiUrl.replace(/\/suggest$/, "/summarize");
  }

  function scheduleSuggestion() {
    clearTimeout(state.timer);
    state.timer = setTimeout(() => requestSuggestion(false), cfg.delay);
  }

  function nowTime() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  function dropEntry(entry) {
    const i = state.suggestions.indexOf(entry);
    if (i >= 0) state.suggestions.splice(i, 1);
  }

  async function requestSuggestion(manual, question, label) {
    if (!state.segments.length && !question) return;
    if (!question && manual && $("mode").value === "answer") {
      question = lastSentence(state.segments[state.segments.length - 1]);
    }
    if (!manual && !question && state.segments.length === state.sentCount) return;

    let entry = null;
    if (question) {
      // Show the question at the top straight away; the answer fills in underneath
      const qn = question.toLowerCase().replace(/[^a-z0-9 ]/g, "").trim();
      if (!manual && qn === state.lastQ) return; // already answered this one
      state.lastQ = qn;
      entry = { time: nowTime(), question: label || question, lines: [], pending: true };
      state.suggestions.push(entry);
      renderSuggestions();
    } else {
      const fresh = state.segments.slice(state.sentCount).join(" ");
      if (!manual && fresh.split(/\s+/).length < 4) return; // wait for a fuller thought
    }

    if (state.inflight) {
      if (entry) state.qQueue.push({ question, entry });
      else state.queued = true;
      return;
    }
    runRequest(question, entry);
  }

  async function runRequest(question, entry) {
    state.inflight = true;
    setBusy("Thinking…");
    const session = state.session;
    const covered = state.segments.length;

    const transcript = state.segments.slice(state.summarizedCount).join("\n").slice(-4000);
    const previous = state.suggestions.filter((s) => !s.pending).slice(-4).flatMap((s) => s.lines);

    try {
      const res = await fetch(cfg.apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          transcript,
          summary: state.summary,
          question: question || "",
          docs: question ? pickReference(question) : "",
          previous,
          mode: $("mode").value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Server error " + res.status);
      if (session !== state.session) return; // session was cleared meanwhile
      state.sentCount = covered;
      showNotice("");
      const lines = data.suggestions || [];
      if (entry) {
        if (lines.length) { entry.lines = lines; entry.pending = false; }
        else dropEntry(entry);
      } else if (lines.length) {
        state.suggestions.push({ time: nowTime(), question: "", lines });
      }
      renderSuggestions();
      maybeSummarize();
    } catch (err) {
      if (entry) dropEntry(entry);
      renderSuggestions();
      showNotice("Couldn't get an answer: " + err.message + ". Check the server address in Settings.");
    } finally {
      state.inflight = false;
      $("thinking").hidden = true;
      const next = state.qQueue.shift();
      if (next) runRequest(next.question, next.entry);
      else if (state.queued) {
        state.queued = false;
        if ($("mode").value !== "answer") scheduleSuggestion();
      }
    }
  }

  /* Rolling summary: keeps long sessions inside the AI's context without losing the thread */
  async function maybeSummarize() {
    if (state.summarizing) return;
    if (state.segments.length - state.summarizedCount < FOLD_AT) return;
    const foldEnd = state.segments.length - KEEP_RECENT;
    const text = state.segments.slice(state.summarizedCount, foldEnd).join("\n");
    const session = state.session;
    state.summarizing = true;
    try {
      const res = await fetch(summarizeUrl(), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ summary: state.summary, text }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || session !== state.session) return;
      state.summary = data.summary || state.summary;
      state.summarizedCount = foldEnd;
      $("memNote").hidden = !state.summary;
    } catch {
      /* summary is an optimisation; try again after the next suggestion */
    } finally {
      state.summarizing = false;
    }
  }

  /* ---------- Controls ---------- */
  $("micBtn").addEventListener("click", () => {
    if (state.mode === "idle") startListening();
    else if (state.mode === "listening") stopListening("paused");
    else startListening();
  });
  $("askBtn").addEventListener("click", () => { clearTimeout(state.timer); requestSuggestion(true); });

  $("clearBtn").addEventListener("click", () => {
    const btn = $("clearBtn");
    if (!state.clearArmed) {
      btn.textContent = "Tap again to clear";
      state.clearArmed = setTimeout(() => { btn.textContent = "Clear session"; state.clearArmed = null; }, 3000);
      return;
    }
    clearTimeout(state.clearArmed);
    state.clearArmed = null;
    btn.textContent = "Clear session";
    if (state.mode !== "idle") stopListening("idle");
    state.segments = []; state.sentCount = 0; state.suggestions = [];
    state.summary = ""; state.summarizedCount = 0; state.pendingQ = null;
    state.qQueue = [];
    state.docs = [];
    renderChips();
    state.session++;
    state.lastQ = "";
    clearTimeout(state.qTimer);
    state.queued = false;
    $("memNote").hidden = true;
    $("askBtn").disabled = true;
    showNotice("");
    renderTranscript();
    renderSuggestions();
  });

  function sendTyped() {
    const q = $("typed").value.trim();
    if (q.length < 2) return;
    $("typed").value = "";
    clearTimeout(state.timer);
    requestSuggestion(true, q);
  }
  $("typedSend").addEventListener("click", sendTyped);
  $("typed").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); sendTyped(); }
  });

  /* ---------- Photos and files ---------- */
  const CDN = {
    tesseract: "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js",
    pdf: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js",
    pdfWorker: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js",
    mammoth: "https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js",
  };
  const loaded = {};
  function loadScript(url) {
    if (!loaded[url]) {
      loaded[url] = new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = url;
        s.onload = resolve;
        s.onerror = () => { delete loaded[url]; reject(new Error("could not load a helper library, check your connection")); };
        document.head.appendChild(s);
      });
    }
    return loaded[url];
  }

  const STOP = new Set(["the","and","for","are","was","were","what","who","how","why","when","where","which","that","this","with","from","your","you","can","does","did","has","have","tell","about","please","explain","define","describe","give","into","than","then","them","they","will","would","could","should","between"]);
  function tokens(s) { return (s.toLowerCase().match(/[a-z0-9]{3,}/g) || []).filter((w) => !STOP.has(w)); }
  function chunkText(t) {
    const out = [];
    let cur = "";
    t.split(/\n+/).forEach((para) => {
      if ((cur + " " + para).length > 700 && cur) { out.push(cur.trim()); cur = para; }
      else cur += " " + para;
    });
    if (cur.trim()) out.push(cur.trim());
    return out.flatMap((c) => (c.length > 1000 ? c.match(/[\s\S]{1,800}/g) : [c]));
  }
  /* Pick the parts of the attached files most relevant to a question */
  function pickReference(question) {
    if (!state.docs.length) return "";
    const all = [];
    state.docs.forEach((d) => chunkText(d.text).forEach((c) => all.push({ name: d.name, text: c })));
    const total = all.reduce((n, c) => n + c.text.length, 0);
    let picked = all;
    if (total > 3500) {
      const q = new Set(tokens(question));
      all.forEach((c) => {
        const w = new Set(tokens(c.text));
        let s = 0;
        q.forEach((t) => { if (w.has(t)) s++; });
        c.score = s;
      });
      picked = all.filter((c) => c.score > 0).sort((a, b) => b.score - a.score).slice(0, 4);
    }
    let out = "";
    for (const c of picked) {
      const piece = "[" + c.name + "] " + c.text + "\n";
      if ((out + piece).length > 3800) break;
      out += piece;
    }
    return out.trim();
  }

  function addDoc(name, text) {
    state.docs.push({ name, text: text.slice(0, 200000) });
    if (state.docs.length > 6) state.docs.shift();
    renderChips();
  }
  function renderChips() {
    const box = $("chips");
    box.textContent = "";
    box.hidden = !state.docs.length;
    state.docs.forEach((d, i) => {
      const c = document.createElement("div");
      c.className = "chip";
      const n = document.createElement("span");
      n.textContent = d.name;
      const x = document.createElement("button");
      x.type = "button";
      x.setAttribute("aria-label", "Remove " + d.name);
      x.textContent = "×";
      x.addEventListener("click", () => { state.docs.splice(i, 1); renderChips(); });
      c.appendChild(n);
      c.appendChild(x);
      box.appendChild(c);
    });
  }

  async function downscale(file) {
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * scale);
      c.height = Math.round(bmp.height * scale);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      return await new Promise((res) => c.toBlob((b) => res(b || file), "image/png"));
    } catch { return file; }
  }
  async function ocrImage(blob) {
    await loadScript(CDN.tesseract);
    const worker = await Tesseract.createWorker("eng", 1, {
      logger: (m) => { if (m.status === "recognizing text") setBusy("Reading photo… " + Math.round(m.progress * 100) + "%"); },
    });
    try {
      const r = await worker.recognize(blob);
      return (r.data.text || "").trim();
    } finally {
      await worker.terminate();
    }
  }
  async function readPdf(file) {
    await loadScript(CDN.pdf);
    const code = await fetch(CDN.pdfWorker).then((r) => r.text());
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let out = "";
    for (let i = 1; i <= Math.min(pdf.numPages, 60); i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      out += tc.items.map((it) => it.str).join(" ") + "\n";
    }
    return out;
  }
  async function readDocx(file) {
    await loadScript(CDN.mammoth);
    const r = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return r.value || "";
  }

  async function handlePhoto(file) {
    if (!file) return;
    showNotice("");
    setBusy("Preparing photo…");
    try {
      const blob = await downscale(file);
      setBusy("Loading text reader… (slower the first time)");
      const text = await ocrImage(blob);
      setBusy("");
      const clean = text.replace(/\s+/g, " ").trim();
      if (clean.length < 3) {
        showNotice("I couldn't find readable text in that photo. Use good light, hold the phone steady, and fill the frame with the text.");
        return;
      }
      const typed = $("typed").value.trim();
      if (typed) {
        addDoc("Photo " + nowTime(), clean);
        $("typed").value = "";
        requestSuggestion(true, typed);
      } else if (clean.length <= 400) {
        requestSuggestion(true, clean, "Photo: " + clean);
      } else {
        addDoc("Photo " + nowTime(), clean);
        showNotice("Photo text saved as reference. Now type or say a question about it.", true);
      }
    } catch (err) {
      setBusy("");
      showNotice("Couldn't read the photo: " + (err.message || err) + ".");
    }
  }

  async function handleFiles(files) {
    for (const f of files) {
      const ext = (f.name.split(".").pop() || "").toLowerCase();
      if (!["pdf", "docx", "txt", "md", "csv"].includes(ext)) {
        showNotice('"' + f.name + '" is not supported. Use PDF, Word (.docx), .txt, .md or .csv.');
        continue;
      }
      try {
        setBusy("Reading " + f.name + "…");
        let text = ext === "pdf" ? await readPdf(f) : ext === "docx" ? await readDocx(f) : await f.text();
        text = text.replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
        if (text.length < 20) {
          showNotice('"' + f.name + '" has no readable text. If it is a scan, take photos of the pages instead.');
          continue;
        }
        addDoc(f.name, text);
        showNotice('Added "' + f.name + '". Ask a question and I will use it.', true);
      } catch (err) {
        showNotice('Couldn\'t read "' + f.name + '": ' + (err.message || err) + ".");
      }
    }
    setBusy("");
  }

  const menu = $("attachMenu");
  $("attachBtn").addEventListener("click", (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; });
  document.addEventListener("click", (e) => { if (!menu.contains(e.target)) menu.hidden = true; });
  $("pickCamera").addEventListener("click", () => { menu.hidden = true; $("inCamera").click(); });
  $("pickPhoto").addEventListener("click", () => { menu.hidden = true; $("inPhoto").click(); });
  $("pickFile").addEventListener("click", () => { menu.hidden = true; $("inFile").click(); });
  ["inCamera", "inPhoto"].forEach((id) => {
    $(id).addEventListener("change", (e) => { const f = e.target.files[0]; e.target.value = ""; handlePhoto(f); });
  });
  $("inFile").addEventListener("change", (e) => { const fs = [...e.target.files]; e.target.value = ""; handleFiles(fs); });

  /* ---------- Settings ---------- */
  const dlg = $("settings");
  $("settingsBtn").addEventListener("click", () => {
    $("apiUrl").value = cfg.apiUrl;
    $("lang").value = cfg.lang;
    $("delay").value = String(cfg.delay);
    $("noise").value = cfg.noise;
    dlg.showModal();
  });
  $("saveSettings").addEventListener("click", () => {
    cfg.apiUrl = $("apiUrl").value.trim() || "https://umah-ai.umahglobal1000.workers.dev/api/suggest";
    cfg.lang = $("lang").value;
    cfg.delay = Number($("delay").value);
    cfg.noise = $("noise").value;
    localStorage.setItem("umah.apiUrl", cfg.apiUrl);
    localStorage.setItem("umah.lang", cfg.lang);
    localStorage.setItem("umah.delay", String(cfg.delay));
    localStorage.setItem("umah.noise", cfg.noise);
    dlg.close();
    if (state.mode === "listening") { stopListening("paused"); startListening(); }
  });

  /* ---------- Camera (desktop) ---------- */
  let camStream = null;
  $("camBtn").addEventListener("click", async () => {
    if (camStream) {
      camStream.getTracks().forEach((t) => t.stop());
      camStream = null;
      $("cam").srcObject = null;
      document.body.classList.remove("cam");
      return;
    }
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: true });
      $("cam").srcObject = camStream;
      document.body.classList.add("cam");
    } catch {
      showNotice("Camera access was blocked. Allow the camera for this page to use the preview.");
    }
  });

  /* ---------- Init ---------- */
  renderTranscript();
  renderSuggestions();
  if (!SR) showNotice("This browser can't do live speech recognition. Use Chrome or Edge.");
})();
</script>
</body>
</html>
